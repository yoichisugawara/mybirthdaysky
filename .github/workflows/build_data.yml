name: Generate Japan Locations JSON

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Generate Locations JSON
        run: |
          node -e '
          const fs = require("fs");

          async function main() {
            console.log("Downloading municipality data...");
            // 正しいエンドポイントURLを指定
            const response = await fetch("https://geolonia.github.io/japanese-addresses/api/ja.json");
            if (!response.ok) throw new Error("Failed to download address data: " + response.statusText);
            const data = await response.json();

            let results = {};

            // Geoloniaのデータは都道府県名をキーにした市区町村名の配列
            for (const prefName in data) {
              if (Array.isArray(data[prefName])) {
                results[prefName] = data[prefName].map(cityName => {
                  return { name: cityName };
                });
              }
            }

            fs.writeFileSync("japan_locations.json", JSON.stringify(results, null, 2), "utf-8");
            console.log("Successfully generated japan_locations.json!");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_locations.json
          git commit -m "Auto-generate full japan_locations.json" || exit 0
          git push
