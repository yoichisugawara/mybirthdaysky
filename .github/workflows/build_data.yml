name: Generate Japan Locations JSON

on:
  workflow_dispatch:
  schedule:
    # 毎月1日 0:00 (UTC) に定期更新
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Generate Locations JSON
        run: |
          node -e '
          const fs = require("fs");

          async function main() {
            console.log("Downloading municipality data...");
            // CODH (ROIS) 提供の全国市区町村境界・位置データ（GeoJSON等）を利用
            const response = await fetch("https://raw.githubusercontent.com/Geolonia/japanese-addresses/main/data/api/ja.json");
            const data = await response.json();

            // 都道府県コード・市区町村コード順に整理して出力用オブジェクトを生成
            const result = {};

            for (const prefName in data) {
              result[prefName] = data[prefName].map(city => ({
                code: city.code,
                name: city.name,
                lat: city.lat,
                lng: city.lng
              }));
            }

            fs.writeFileSync("japan_locations.json", JSON.stringify(result, null, 2));
            console.log("Successfully generated japan_locations.json!");
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Commit and Push if changed
        run: |
          git config local user.email "action@github.com"
          git config local user.name "GitHub Action"
          git status
          git add japan_locations.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update japan_locations.json [skip ci]" && git push)
