name: Generate Japan Locations JSON

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Locations JSON
        run: |
          python3 -c '
          import urllib.request
          import json

          # 全国の市区町村と正確な緯度経度が含まれているオープンデータ（Geoloniaの別エンドポイント または 国土地理院ベースのデータ）を取得
          url = "https://raw.githubusercontent.com/geolonia/japanese-addresses/master/data/latest.json"
          print("Downloading full address data with coordinates...")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode("utf-8"))

          # アプリが使いやすいようにフラットな配列で、name, lat, lon を持たせる形に整形
          results = []
          for item in data:
              pref = item.get("pref", "")
              city = item.get("city", "")
              lat = item.get("lat")
              lon = item.get("lng")
              
              if pref and city and lat is not None and lon is not None:
                  full_name = f"{pref} {city}"
                  # 重複を防ぎつつ追加
                  results.append({
                      "name": full_name,
                      "lat": float(lat),
                      "lon": float(lon)
                  })

          # 重複を排除
          seen = set()
          unique_results = []
          for r in results:
              if r["name"] not in seen:
                  seen.add(r["name"])
                  unique_results.append(r)

          with open("japan_locations.json", "w", encoding="utf-8") as f:
              json.dump(unique_results, f, ensure_ascii=False, indent=2)
          
          print(f"Successfully generated {len(unique_results)} locations with lat/lon!")
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_locations.json
          git commit -m "Auto-generate full japan_locations.json with coordinates" || exit 0
          git push
