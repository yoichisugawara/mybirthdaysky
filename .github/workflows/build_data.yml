name: Generate Japan Locations JSON

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch and Generate Locations JSON
        run: |
          node -e '
          const fs = require("fs");

          async function main() {
            console.log("Downloading municipality data...");
            const response = await fetch("https://raw.githubusercontent.com/Geolonia/japanese-addresses/main/data/api/ja.json");
            if (!response.ok) throw new Error("Failed to download address data");
            const data = await response.json();

            let results = [];

            for (const prefName in data) {
              if (Array.isArray(data[prefName])) {
                data[prefName].forEach(city => {
                  results.push({
                    name: `${prefName} ${city.name}`,
                    lat: city.lat,
                    lon: city.lng
                  });
                });
              }
            }

            fs.writeFileSync("japan_locations.json", JSON.stringify(results, null, 2), "utf-8");
            console.log(`Successfully generated ${results.length} locations!`);
          }

          main().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_locations.json
          git commit -m "Auto-generate full japan_locations.json" || exit 0
          git push
