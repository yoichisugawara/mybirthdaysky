name: Build Japan Locations JSON

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and process address data
        run: |
          python3 -c "
          import urllib.request, csv, json

          # 最新の動作確認済みデータソースURL
          urls = [
              'https://raw.githubusercontent.com/geolonia/japanese-addresses/master/data/latest.csv',
              'https://geolonia.github.io/japanese-addresses/data/latest.csv'
          ]
          
          lines = []
          for url in urls:
              try:
                  print(f'Trying to fetch from: {url}')
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as response:
                      lines = [line.decode('utf-8') for line in response.readlines()]
                      if len(lines) > 0:
                          print('Successfully downloaded CSV data!')
                          break
              except Exception as e:
                  print(f'Failed from {url}: {e}')

          if not lines:
              raise Exception('All download URLs failed!')

          res = []
          reader = csv.DictReader(lines)
          for row in reader:
              pref = row.get('pref', '')
              city = row.get('city', '')
              town = row.get('town', '')
              try:
                  lat = float(row.get('lat', 0))
                  lon = float(row.get('lng', 0))
              except (ValueError, TypeError):
                  continue
              
              name = f'{pref} {city} {town}'.strip()
              if name and lat and lon:
                  res.append({'name': name, 'lat': round(lat, 4), 'lon': round(lon, 4)})

          print(f'Processed {len(res)} locations.')
          if len(res) > 0:
              with open('japan_locations.json', 'w', encoding='utf-8') as f:
                  json.dump(res, f, ensure_ascii=False, separators=(',', ':'))
          else:
              raise Exception('Generated data is empty!')
          "

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_locations.json
          git commit -m "Auto-generate full japan_locations.json" || exit 0
          git push
