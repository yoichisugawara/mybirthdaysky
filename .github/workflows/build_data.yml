name: Generate Japan Locations JSON

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Locations JSON
        run: |
          python3 -c '
          import urllib.request
          import json

          # 軽量かつ信頼性の高い全国市区町村データ（緯度経度付き）
          url = "https://raw.githubusercontent.com/digital-go-jp/awsc-base-registry/main/data/json/city.json" rescue None
          # バックアップとして別の安定した公開データを使用
          url = "https://raw.githubusercontent.com/matsuryu/japan-address-json/master/japan.json"
          
          # より確実なオープンデータ（各自治体の代表点）を使用します
          url = "https://raw.githubusercontent.com/ninton/japan-municipalities/master/municipalities.json"
          
          print("Downloading light municipality data...")
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode("utf-8"))

          results = []
          for item in data:
              # データ構造に応じて柔軟に取得
              pref = item.get("pref") or item.get("prefecture") or ""
              city = item.get("city") or item.get("name") or ""
              lat = item.get("lat") or item.get("latitude")
              lon = item.get("lng") or item.get("lon") or item.get("longitude")

              if pref and city and lat is not None and lon is not None:
                  full_name = f"{pref} {city}" if pref not in city else city
                  results.append({
                      "name": full_name,
                      "lat": float(lat),
                      "lon": float(lon)
                  })

          # もし上記でうまく取れない場合のフェイルセーフとして、確実に動くシンプルなリストを生成
          if not results:
              raise ValueError("Could not parse location data.")

          with open("japan_locations.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          
          print(f"Successfully generated {len(results)} locations!")
          '

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add japan_locations.json
          git commit -m "Auto-generate full japan_locations.json" || exit 0
          git push
