          let results = [];
          
          prefectures.forEach(pref => {
            pref.cities.forEach((cityName, idx) => {
              // 座標調整用オフセット計算
              let latOffset = ((idx % 8) - 4) * 0.015;
              let lonOffset = (Math.floor(idx / 8) - 2) * 0.015;
              
              results.push({
                name: `${pref.name} ${cityName}`,
                lat: Math.round((pref.lat + latOffset) * 10000) / 10000,
                lon: Math.round((pref.lon + lonOffset) * 10000) / 10000
              });
            });
          });

          fs.writeFileSync("japan_locations.json", JSON.stringify(results, null, 2), "utf-8");
          console.log(`生成成功: ${results.length} 件のデータを登録しました。`);
