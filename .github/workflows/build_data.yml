name: Generate Japan Locations JSON

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: |
          git clone https://github.com/${{ github.repository }}.git .
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Locations JSON via Python
        run: |
          python3 -c '
          import urllib.request
          import json
          import sys

          url = "https://raw.githubusercontent.com/ninton/japan-municipalities/master/municipalities.json"
          print("Downloading nationwide municipality data...")

          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
          except Exception as e:
              print(f"Error: {e}", file=sys.stderr)
              sys.exit(1)

          results = []
          for item in data:
              pref = item.get("pref") or item.get("prefecture") or ""
              city = item.get("city") or item.get("name") or ""
              lat = item.get("lat") or item.get("latitude")
              lon = item.get("lng") or item.get("lon") or item.get("longitude")

              if pref and city and lat is not None and lon is not None:
                  full_name = f"{pref} {city}" if not city.startswith(pref) else city
                  results.append({
                      "name": full_name,
                      "lat": float(lat),
                      "lon": float(lon)
                  })

          if not results:
              print("Error: No locations found.", file=sys.stderr)
              sys.exit(1)

          with open("japan_locations.json", "w", encoding="utf-8") as f:
              json.dump(results, f, ensure_ascii=False, indent=2)
          
          print(f"Successfully generated {len(results)} locations nationwide!")
          '

      - name: Commit and Push
        run: |
          git add japan_locations.json
          git commit -m "Update full nationwide japan_locations.json" || exit 0
          git push
