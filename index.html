<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私が生まれた日の空模様</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .subtitle {
      font-size: 0.9rem;
      text-align: center;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      background-color: #fff;
      appearance: none;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    /* 結果エリア */
    .result-card {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
      border: 1px solid #bae6fd;
      text-align: center;
    }

    .result-date-location {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .result-weather-main {
      font-size: 2.2rem;
      font-weight: bold;
      margin: 12px 0;
    }

    .result-temps {
      font-size: 1.1rem;
      margin-bottom: 16px;
    }

    .btn-share-open {
      width: 100%;
      padding: 12px;
      background-color: #0f172a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* PWAインストール案内用バナー */
    .pwa-banner {
      display: none; 
      position: fixed; 
      bottom: 16px; 
      left: 16px; 
      right: 16px;
      margin: 0 auto;
      max-width: 440px; 
      background: #fff; 
      padding: 16px;
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
      z-index: 1100;
      border: 2px solid var(--primary-color); 
      text-align: left;
      box-sizing: border-box;
    }

    .pwa-banner-title {
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 4px;
    }

    .pwa-banner-text {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .pwa-btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-pwa-install {
      flex: 1;
      padding: 8px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-pwa-dismiss {
      padding: 8px 12px;
      background: #f1f5f9;
      color: var(--text-sub);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* モーダルダイアログ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 24px;
      box-sizing: border-box;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 16px;
      text-align: center;
    }

    .privacy-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .privacy-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
    }

    .privacy-option input {
      width: auto;
      margin-top: 3px;
    }

    .option-label {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .option-desc {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .share-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-share-x {
      background: #000;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-share-line {
      background: #06c755;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-share-web {
      background: #f1f5f9;
      color: var(--text-color);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-weight: bold;
      cursor: pointer;
    }

    .btn-modal-close {
      margin-top: 12px;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.85rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>私が生まれた日の空模様</h1>
    <div class="subtitle">1940年以降の生年月日から当時の天気を再現</div>

    <form id="weatherForm">
      <div class="form-group">
        <label>生年月日</label>
        <div class="form-row">
          <select id="yearSelect" required></select>
          <select id="monthSelect" required></select>
          <select id="daySelect" required></select>
        </div>
      </div>

      <div class="form-group">
        <label>出生地（都道府県）</label>
        <select id="prefSelect" required></select>
      </div>

      <button type="submit" class="btn-submit">空模様を検索する</button>
    </form>

    <div id="resultCard" class="result-card">
      <div id="resDateLoc" class="result-date-location"></div>
      <div id="resWeather" class="result-weather-main"></div>
      <div id="resTemps" class="result-temps"></div>
      <button type="button" class="btn-share-open" id="openShareModalBtn">
        📤 SNS・メッセージで共有する
      </button>
    </div>
  </div>

  <!-- PWAホーム追加案内バナー -->
  <div id="pwaBanner" class="pwa-banner">
    <div class="pwa-banner-title">📱 ホーム画面に追加しませんか？</div>
    <div class="pwa-banner-text" id="pwaBannerText">
      アプリのように全画面表示でスムーズに呼び出せるようになります！
    </div>
    <div class="pwa-btn-group">
      <button type="button" class="btn-pwa-install" id="pwaActionBtn">追加する</button>
      <button type="button" class="btn-pwa-dismiss" id="pwaDismissBtn">あとで</button>
    </div>
  </div>

  <!-- シェア設定モーダル -->
  <div id="shareModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">📱 シェアの設定</div>
      
      <div class="privacy-options">
        <label class="privacy-option">
          <input type="radio" name="privacyLevel" value="season" checked>
          <div>
            <div class="option-label">🔒 季節・天気のみ（おすすめ）</div>
            <div class="option-desc">年月日と場所を伏せ、季節とざっくりした気温のみ共有します。</div>
          </div>
        </label>

        <label class="privacy-option">
          <input type="radio" name="privacyLevel" value="birthday">
          <div>
            <div class="option-label">🎂 月日・天気のみ</div>
            <div class="option-desc">生年と都道府県以下を伏せ、誕生日当日などのアピールに使えます。</div>
          </div>
        </label>

        <label class="privacy-option">
          <input type="radio" name="privacyLevel" value="full">
          <div>
            <div class="option-label">📢 すべて表示</div>
            <div class="option-desc">生年月日と都道府県をそのまま表示します。</div>
          </div>
        </label>
      </div>

      <div class="share-actions">
        <button type="button" class="btn-share-x" id="shareXBtn">𝕏 (Twitter) で投稿</button>
        <button type="button" class="btn-share-line" id="shareLineBtn">LINE で送る</button>
        <button type="button" class="btn-share-web" id="shareWebBtn">🔗 その他のアプリ・メールで共有</button>
      </div>

      <button type="button" class="btn-modal-close" id="closeShareModalBtn">閉じる</button>
    </div>
  </div>

  <script>
    // 都道府県および地方・座標データ
    const prefectures = [
      { name: "北海道", region: "北海道地方", lat: 43.0642, lon: 141.3469 },
      { name: "青森県", region: "東北地方", lat: 40.8244, lon: 140.7400 },
      { name: "岩手県", region: "東北地方", lat: 39.7036, lon: 141.1527 },
      { name: "宮城県", region: "東北地方", lat: 38.2688, lon: 140.8719 },
      { name: "秋田県", region: "東北地方", lat: 39.7186, lon: 140.1024 },
      { name: "山形県", region: "東北地方", lat: 38.2404, lon: 140.3633 },
      { name: "福島県", region: "東北地方", lat: 37.7500, lon: 140.4678 },
      { name: "茨城県", region: "関東地方", lat: 36.3418, lon: 140.4468 },
      { name: "栃木県", region: "関東地方", lat: 36.5658, lon: 139.8836 },
      { name: "群馬県", region: "関東地方", lat: 36.3911, lon: 139.0608 },
      { name: "埼玉県", region: "関東地方", lat: 35.8574, lon: 139.6489 },
      { name: "千葉県", region: "関東地方", lat: 35.6047, lon: 140.1233 },
      { name: "東京都", region: "関東地方", lat: 35.6895, lon: 139.6917 },
      { name: "神奈川県", region: "関東地方", lat: 35.4478, lon: 139.6425 },
      { name: "新潟県", region: "中部地方", lat: 37.9022, lon: 139.0236 },
      { name: "富山県", region: "中部地方", lat: 36.6953, lon: 137.2113 },
      { name: "石川県", region: "中部地方", lat: 36.5947, lon: 136.6256 },
      { name: "福井県", region: "中部地方", lat: 36.0652, lon: 136.2216 },
      { name: "山梨県", region: "中部地方", lat: 35.6639, lon: 138.5683 },
      { name: "長野県", region: "中部地方", lat: 36.6513, lon: 138.1810 },
      { name: "岐阜県", region: "東海地方", lat: 35.3912, lon: 136.7223 },
      { name: "静岡県", region: "東海地方", lat: 34.9769, lon: 138.3831 },
      { name: "愛知県", region: "東海地方", lat: 35.1802, lon: 136.9066 },
      { name: "三重県", region: "東海地方", lat: 34.7303, lon: 136.5086 },
      { name: "滋賀県", region: "近畿地方", lat: 35.0045, lon: 135.8686 },
      { name: "京都府", region: "近畿地方", lat: 35.0211, lon: 135.7556 },
      { name: "大阪府", region: "近畿地方", lat: 34.6937, lon: 135.5023 },
      { name: "兵庫県", region: "近畿地方", lat: 34.6913, lon: 135.1830 },
      { name: "奈良県", region: "近畿地方", lat: 34.6853, lon: 135.8328 },
      { name: "和歌山県", region: "近畿地方", lat: 34.2260, lon: 135.1675 },
      { name: "鳥取県", region: "中国地方", lat: 35.5011, lon: 134.2351 },
      { name: "島根県", region: "中国地方", lat: 35.4723, lon: 133.0505 },
      { name: "岡山県", region: "中国地方", lat: 34.6618, lon: 133.9344 },
      { name: "広島県", region: "中国地方", lat: 34.3963, lon: 132.4594 },
      { name: "山口県", region: "中国地方", lat: 34.1858, lon: 131.4714 },
      { name: "徳島県", region: "四国地方", lat: 34.0657, lon: 134.5593 },
      { name: "香川県", region: "四国地方", lat: 34.3401, lon: 134.0433 },
      { name: "愛媛県", region: "四国地方", lat: 33.8416, lon: 132.7654 },
      { name: "高知県", region: "四国地方", lat: 33.5597, lon: 133.5311 },
      { name: "福岡県", region: "九州地方", lat: 33.6064, lon: 130.4181 },
      { name: "佐賀県", region: "九州地方", lat: 33.2494, lon: 130.2988 },
      { name: "長崎県", region: "九州地方", lat: 32.7448, lon: 129.8737 },
      { name: "熊本県", region: "九州地方", lat: 32.7898, lon: 130.7417 },
      { name: "大分県", region: "九州地方", lat: 33.2382, lon: 131.6126 },
      { name: "宮崎県", region: "九州地方", lat: 31.9111, lon: 131.4239 },
      { name: "鹿児島県", region: "九州地方", lat: 31.5602, lon: 130.5581 },
      { name: "沖縄県", region: "沖縄", lat: 26.2124, lon: 127.6809 }
    ];

    // ドロップダウン初期化
    const yearSelect = document.getElementById('yearSelect');
    const monthSelect = document.getElementById('monthSelect');
    const daySelect = document.getElementById('daySelect');
    const prefSelect = document.getElementById('prefSelect');

    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 1940; y--) {
      yearSelect.add(new Option(`${y}年`, y));
    }
    for (let m = 1; m <= 12; m++) {
      monthSelect.add(new Option(`${m}月`, m));
    }
    for (let d = 1; d <= 31; d++) {
      daySelect.add(new Option(`${d}日`, d));
    }

    prefectures.forEach((p, idx) => {
      prefSelect.add(new Option(p.name, idx));
    });

    // 取得したデータの保持用
    let currentData = null;

    // 詳細な天気マッピング表
    const weatherMap = {
      0: { text: "快晴", icon: "☀️", simple: "快晴" },
      1: { text: "晴れ", icon: "🌤️", simple: "晴れ" },
      2: { text: "一部曇り", icon: "⛅", simple: "晴れ・曇り" },
      3: { text: "曇り", icon: "☁️", simple: "曇り" },
      45: { text: "霧", icon: "🌫️", simple: "曇り" },
      48: { text: "霧氷", icon: "🌫️", simple: "曇り" },
      51: { text: "霧雨", icon: "🌧️", simple: "雨" },
      61: { text: "弱い雨", icon: "☔", simple: "雨" },
      63: { text: "雨", icon: "☔", simple: "雨" },
      65: { text: "強い雨", icon: "🌧️", simple: "雨" },
      71: { text: "弱い雪", icon: "❄️", simple: "雪" },
      73: { text: "雪", icon: "❄️", simple: "雪" },
      75: { text: "強い雪", icon: "☃️", simple: "雪" },
      80: { text: "にわか雨", icon: "🌦️", simple: "雨" },
      95: { text: "雷雨", icon: "⚡", simple: "荒天" }
    };

    // 天気コード変換関数
    function getWeatherLabel(code) {
      if (weatherMap[code]) {
        const item = weatherMap[code];
        return {
          text: `${item.text} ${item.icon}`,
          simple: item.simple
        };
      }
      
      // 予備データ
      if (code <= 3) return { text: "晴れ/曇り ⛅", simple: "晴れ・曇り" };
      if (code <= 67) return { text: "雨 ☔", simple: "雨" };
      if (code <= 77) return { text: "雪 ❄️", simple: "雪" };
      return { text: "荒天 ⛈️", simple: "荒天" };
    }

    // 季節の判定
    function getSeason(month) {
      if (month >= 3 && month <= 5) return "春";
      if (month >= 6 && month <= 8) return "夏";
      if (month >= 9 && month <= 11) return "秋";
      return "冬";
    }

    // フォーム送信
    document.getElementById('weatherForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const year = yearSelect.value;
      const month = String(monthSelect.value).padStart(2, '0');
      const day = String(daySelect.value).padStart(2, '0');
      const dateStr = `${year}-${month}-${day}`;

      const prefIdx = prefSelect.value;
      const prefData = prefectures[prefIdx];

      try {
        const url = `https://archive-api.open-meteo.com/v1/archive?latitude=${prefData.lat}&longitude=${prefData.lon}&start_date=${dateStr}&end_date=${dateStr}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.daily) {
          const maxTemp = data.daily.temperature_2m_max[0];
          const minTemp = data.daily.temperature_2m_min[0];
          const code = data.daily.weather_code[0];
          const weatherInfo = getWeatherLabel(code);

          currentData = {
            year, month: monthSelect.value, day: daySelect.value,
            pref: prefData.name, region: prefData.region,
            weatherText: weatherInfo.text, weatherSimple: weatherInfo.simple,
            maxTemp, minTemp
          };

          document.getElementById('resDateLoc').innerText = `${year}年${monthSelect.value}月${daySelect.value}日（${prefData.name}）`;
          document.getElementById('resWeather').innerText = weatherInfo.text;
          document.getElementById('resTemps').innerText = `最高 ${maxTemp}℃ / 最低 ${minTemp}℃`;
          document.getElementById('resultCard').style.display = 'block';
        }
      } catch (err) {
        alert('気象データの取得に失敗しました。');
      }
    });

    // モーダル表示制御
    const shareModal = document.getElementById('shareModal');
    document.getElementById('openShareModalBtn').addEventListener('click', () => {
      shareModal.style.display = 'flex';
    });
    document.getElementById('closeShareModalBtn').addEventListener('click', () => {
      shareModal.style.display = 'none';
    });

    // シェア文言作成ロジック
    function buildShareText() {
      if (!currentData) return '';

      const level = document.querySelector('input[name="privacyLevel"]:checked').value;
      const season = getSeason(parseInt(currentData.month));
      const roundMax = Math.round(currentData.maxTemp);

      if (level === 'season') {
        return `${currentData.region}で${season}に生まれた私の日の空模様は【${currentData.weatherSimple} / 最高気温${roundMax}℃前後】でした！ #私が生まれた日の空模様`;
      } else if (level === 'birthday') {
        return `${currentData.month}月${currentData.day}日生まれ（${currentData.pref}）の私が生まれた日の空は【${currentData.weatherText}】最高${currentData.maxTemp}℃でした！ #私が生まれた日の空模様`;
      } else {
        return `${currentData.year}年${currentData.month}月${currentData.day}日 ${currentData.pref}で生まれた日の空模様は【${currentData.weatherText}】最高${currentData.maxTemp}℃ / 最低${currentData.minTemp}℃ でした！ #私が生まれた日の空模様`;
      }
    }

    // 各シェアボタンイベント
    document.getElementById('shareXBtn').addEventListener('click', () => {
      const text = encodeURIComponent(buildShareText());
      window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
    });

    document.getElementById('shareLineBtn').addEventListener('click', () => {
      const text = encodeURIComponent(buildShareText());
      window.open(`https://line.me/R/msg/text/?${text}`, '_blank');
    });

    document.getElementById('shareWebBtn').addEventListener('click', async () => {
      const text = buildShareText();
      if (navigator.share) {
        try {
          await navigator.share({
            title: '私が生まれた日の空模様',
            text: text
          });
        } catch (err) {}
      } else {
        await navigator.clipboard.writeText(text);
        alert('シェア用テキストをクリップボードにコピーしました！');
      }
    });

    // PWA案内バナー制御
    const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const pwaBanner = document.getElementById('pwaBanner');
    const pwaActionBtn = document.getElementById('pwaActionBtn');

    function showPwaBanner() {
      if (window.matchMedia('(display-mode: standalone)').matches) return;

      if (isiOS) {
        document.getElementById('pwaBannerText').innerText = "Safariの「共有ボタン (↑)」をタップし、「ホーム画面に追加」を選択してください。";
        pwaActionBtn.innerText = "OK";
      } else {
        document.getElementById('pwaBannerText').innerText = "アプリとしてインストールすると、ホーム画面から簡単に開けるようになります！";
        pwaActionBtn.innerText = "追加する";
      }
      pwaBanner.style.display = 'block';
    }

    document.getElementById('pwaDismissBtn').addEventListener('click', () => {
      pwaBanner.style.display = 'none';
    });

    window.addEventListener('load', () => {
      setTimeout(showPwaBanner, 1500);
    });
  </script>
</body>
</html>
